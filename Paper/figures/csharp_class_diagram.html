<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoLux · CPU C# Architecture</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-paper: #ffffff;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg {
      width: 100%;
      min-width: 900px;
      display: block;
    }
  </style>
</head>

<body>
  <div class="frame">
    <p class="eyebrow">Architecture Diagram</p>
    <h1>ChronoLux C# Class Dependencies</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff" />

      <!-- Flow Arrows -->
      <!-- LightDoseSimulator calls SunCalculator -->
      <line x1="220" y1="200" x2="380" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- LightDoseSimulator calls IrradianceBaker -->
      <line x1="220" y1="240" x2="380" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />

      <!-- LightDoseSimulator calls ObjLoader -->
      <line x1="220" y1="280" x2="380" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- IrradianceBaker pulls SimulationMaterial -->
      <line x1="540" y1="200" x2="680" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- IrradianceBaker dispatches to DXR -->
      <line x1="540" y1="240" x2="680" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" />

      <!-- ObjLoader passes geometry to IrradianceBaker -->
      <line x1="540" y1="340" x2="680" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Arrow labels -->
      <rect x="276" y="228" width="48" height="12" rx="2" fill="#ffffff" />
      <text x="300" y="238" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">INVOKE</text>

      <rect x="586" y="228" width="48" height="12" rx="2" fill="#ffffff" />
      <text x="610" y="238" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">GPU C.B.</text>


      <!-- Node: Main Controller (focal coral) -->
      <rect x="60" y="208" width="160" height="64" rx="6" fill="#ffffff" />
      <rect x="60" y="208" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"
        stroke-width="1" />
      <rect x="68" y="216" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)"
        stroke-width="0.8" />
      <text x="86" y="225" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">ORCHEST</text>
      <text x="140" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">LightDoseSimulator</text>
      <text x="140" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Main
        Accumulation Loop</text>

      <!-- Node: SunCalculator -->
      <rect x="380" y="88" width="160" height="64" rx="6" fill="#ffffff" />
      <rect x="380" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <rect x="388" y="96" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)"
        stroke-width="0.8" />
      <text x="404" y="105" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">MATH</text>
      <text x="460" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">SunCalculator</text>
      <text x="460" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">Azimuth/Zenith SPA</text>

      <!-- Node: IrradianceBaker -->
      <rect x="380" y="208" width="160" height="64" rx="6" fill="#ffffff" />
      <rect x="380" y="208" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <rect x="388" y="216" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)"
        stroke-width="0.8" />
      <text x="404" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">CORE</text>
      <text x="460" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">IrradianceBaker</text>
      <text x="460" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">RayTracing Environment</text>

      <!-- Node: ObjLoader -->
      <rect x="380" y="328" width="160" height="64" rx="6" fill="#ffffff" />
      <rect x="380" y="328" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <rect x="388" y="336" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)"
        stroke-width="0.8" />
      <text x="404" y="345" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">IO</text>
      <text x="460" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">ObjLoader</text>
      <text x="460" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">Async Thread Parser</text>

      <!-- Node: SimulationMaterial -->
      <rect x="680" y="108" width="160" height="64" rx="6" fill="#ffffff" />
      <rect x="680" y="108" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"
        stroke-width="1" />
      <rect x="688" y="116" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)"
        stroke-width="0.8" />
      <text x="704" y="125" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">DATA</text>
      <text x="760" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">SimulationMaterial</text>
      <text x="760" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">Reflectance & Transmittance</text>

      <!-- Node: DXR Kernel (External) -->
      <rect x="680" y="208" width="160" height="64" rx="6" fill="#ffffff" />
      <rect x="680" y="208" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"
        stroke-width="1" />
      <rect x="688" y="216" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)"
        stroke-width="0.8" />
      <text x="704" y="225" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">GPU</text>
      <text x="760" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">PathTracer Kernel</text>
      <text x="760" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DX12
        RayTracing</text>

      <!-- Node: GeometryScraper -->
      <rect x="680" y="308" width="160" height="64" rx="6" fill="#ffffff" />
      <rect x="680" y="308" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"
        stroke-width="1" />
      <rect x="688" y="316" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)"
        stroke-width="0.8" />
      <text x="704" y="325" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">UTIL</text>
      <text x="760" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">GeometryScraper</text>
      <text x="760" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">Vertex/Index Extraction</text>
    </svg>
  </div>
</body>

</html>
