<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Diagram</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-paper: #ffffff;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg {
      width: 100%;
      min-width: 900px;
      display: block;
    }

    @media print {
      @page {
        margin: 0;
        size: auto;
      }

      body {
        padding: 0;
        margin: 0;
        min-height: auto;
      }

      .eyebrow,
      h1 {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="frame">
    <p class="eyebrow">Architecture · ChronoLux System</p>
    <h1>Detailed System Architecture</h1>

    <svg viewBox="0 60 1200 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)" />
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff" />

      <!-- Cleaned up Macro Data Flow Arrows -->
      <line x1="270" y1="290" x2="310" y2="290" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)" />
      <!-- UI to Simulation -->
      <line x1="590" y1="290" x2="630" y2="290" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)" />
      <!-- Simulation to GPU -->
      <line x1="890" y1="290" x2="930" y2="290" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)" />
      <!-- GPU to Persistence -->

      <!-- Intra-GPU Arrows -->
      <line x1="760" y1="180" x2="760" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
      <line x1="760" y1="250" x2="760" y2="270" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
      <line x1="760" y1="320" x2="760" y2="340" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />
      <line x1="760" y1="390" x2="760" y2="410" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />

      <!-- ================= UI Layer ================= -->
      <rect x="40" y="80" width="220" height="420" rx="8" fill="rgba(79,93,117,0.05)" stroke="rgba(122,131,153,0.4)"
        stroke-width="1" stroke-dasharray="4 4" />
      <text x="150" y="110" fill="#7a8399" font-size="10" font-weight="600" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.1em">UI LAYER (UXML/USS)</text>

      <rect x="60" y="140" width="180" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="150" y="165" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Project Launcher</text>

      <rect x="60" y="210" width="180" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="150" y="235" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Laboratory HUD</text>

      <rect x="60" y="280" width="180" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="150" y="305" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Material Catalog</text>

      <rect x="60" y="350" width="180" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="150" y="375" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Solar Telemetry</text>

      <!-- ================= Simulation Engine ================= -->
      <rect x="320" y="80" width="260" height="420" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.2)"
        stroke-width="1" stroke-dasharray="4 4" />
      <text x="450" y="110" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.1em">SIMULATION ENGINE (C#)</text>

      <rect x="340" y="140" width="220" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="450" y="165" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">ObjectPicker & Cam</text>

      <rect x="340" y="210" width="220" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="450" y="235" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Mesh Normal Scraper</text>

      <rect x="340" y="280" width="220" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="450" y="305" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">LightDoseSimulator</text>

      <rect x="340" y="350" width="220" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="450" y="375" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Headless CSV Exporter</text>

      <!-- ================= GPU Compute ================= -->
      <rect x="640" y="80" width="240" height="420" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.5)"
        stroke-width="1.5" stroke-dasharray="4 4" />
      <text x="760" y="110" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.1em">GPU COMPUTE (DX12 / DXR)</text>

      <rect x="660" y="140" width="200" height="40" rx="4" fill="rgba(235,108,54,0.1)" stroke="#eb6c36"
        stroke-width="1.5" />
      <text x="760" y="165" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">UV Space Baker</text>

      <rect x="660" y="210" width="200" height="40" rx="4" fill="rgba(235,108,54,0.1)" stroke="#eb6c36"
        stroke-width="1.5" />
      <text x="760" y="235" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">RayGen Kernel</text>

      <rect x="660" y="280" width="200" height="40" rx="4" fill="rgba(235,108,54,0.1)" stroke="#eb6c36"
        stroke-width="1.5" />
      <text x="760" y="305" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Perez Sky & NEE</text>

      <rect x="660" y="350" width="200" height="40" rx="4" fill="rgba(235,108,54,0.1)" stroke="#eb6c36"
        stroke-width="1.5" />
      <text x="760" y="375" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Accumulation Buffer</text>

      <rect x="660" y="420" width="200" height="40" rx="4" fill="rgba(235,108,54,0.1)" stroke="#eb6c36"
        stroke-width="1.5" />
      <text x="760" y="445" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Heatmap Shader</text>

      <!-- ================= Data Persistence ================= -->
      <rect x="940" y="80" width="220" height="420" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"
        stroke-dasharray="4 4" />
      <text x="1050" y="110" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.1em">DATA PERSISTENCE</text>

      <rect x="960" y="140" width="180" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1" />
      <text x="1050" y="165" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Project JSON</text>

      <rect x="960" y="280" width="180" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1" />
      <text x="1050" y="305" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Dosimetry CSVs</text>

      <rect x="960" y="350" width="180" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1" />
      <text x="1050" y="375" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">EXR Snapshots</text>

    </svg>
  </div>
</body>

</html>
