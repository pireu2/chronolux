<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { background: #ffffff; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { max-width: 800px; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 600 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<g filter="url(#sketchy)">
  <!-- Arrows -->
  <path d="M 300 120 L 300 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 300 280 L 300 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 300 440 L 300 480" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M 300 600 L 300 640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 220 660 L 80 660 L 80 220 L 140 220" fill="none" stroke="#4f5d75" stroke-dasharray="5,4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Start Oval -->
  <rect x="220" y="80" width="160" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  
  <!-- Node 1: Math -->
  <rect x="140" y="160" width="320" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="148" y="168" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  
  <!-- Node 2: Perez -->
  <rect x="140" y="320" width="320" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="148" y="328" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  
  <!-- Node 3: Trace -->
  <rect x="140" y="480" width="320" height="120" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="148" y="488" width="40" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
  
  <!-- End Loop -->
  <rect x="220" y="640" width="160" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  
  <rect x="44" y="440" width="72" height="16" rx="2" fill="#ffffff"/>
</g>

<g>
  <!-- Title -->
  <text x="40" y="40" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Astrometric &amp; Path Tracing Flow</text>
  <text x="40" y="60" fill="#7a8399" font-size="14" font-family="'Geist', sans-serif">Step-by-step logic for a single simulation hour.</text>

  <!-- Start Text -->
  <text x="300" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Start: Simulation Hour (t)</text>

  <!-- Node 1: Math Text -->
  <text x="168" y="179" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MATH</text>
  <text x="300" y="200" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Julian Day Celestial Math</text>
  <text x="300" y="220" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Calculates precise Solar Zenith and Azimuth</text>
  <text x="300" y="238" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">angles based on Latitude (44.4° N) and</text>
  <text x="300" y="256" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Longitude for Bucharest.</text>

  <!-- Node 2: Perez Text -->
  <text x="168" y="339" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LUMA</text>
  <text x="300" y="360" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Perez All-Weather Sky</text>
  <text x="300" y="380" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Distributes diffuse skylight across the</text>
  <text x="300" y="398" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">hemisphere using clear-sky turbidity (T=2.0)</text>
  <text x="300" y="416" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">and the calculated sun position.</text>

  <!-- Node 3: Trace Text -->
  <text x="168" y="499" fill="rgba(235,108,54,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DXR</text>
  <text x="300" y="520" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hardware RayGen Kernel</text>
  <text x="300" y="540" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Fires 64 stochastic Monte Carlo rays per</text>
  <text x="300" y="558" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">UV texel, integrating both Direct (Sun) and</text>
  <text x="300" y="576" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">Indirect (Perez Sky) light.</text>

  <!-- End Loop Text -->
  <text x="300" y="664" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loop: t = t + 1</text>
  <text x="80" y="451" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPEAT 8760x</text>

  <!-- Editorial Note -->
  <text x="480" y="520" fill="#eb6c36" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">Bakes directly</text>
  <text x="480" y="540" fill="#eb6c36" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">into texture space</text>
</g>
</svg>
</body>
</html>
