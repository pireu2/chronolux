<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { background: #ffffff; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { max-width: 900px; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<g filter="url(#sketchy)">
  <!-- Lane Dividers -->
  <line x1="140" y1="240" x2="960" y2="240" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <line x1="140" y1="360" x2="960" y2="360" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Edges/Arrows -->
  <path d="M 300 180 L 340 180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 410 220 L 410 260" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <path d="M 480 300 L 520 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 590 340 L 590 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 660 420 L 700 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow Labels Masks -->
  <rect x="296" y="172" width="48" height="16" rx="2" fill="#ffffff"/>
  <rect x="390" y="232" width="40" height="16" rx="2" fill="#ffffff"/>
  <rect x="480" y="292" width="40" height="16" rx="2" fill="#ffffff"/>
  <rect x="570" y="352" width="40" height="16" rx="2" fill="#ffffff"/>
  <rect x="660" y="412" width="40" height="16" rx="2" fill="#ffffff"/>

  <!-- Nodes -->
  <!-- Node GPU: Accumulate -->
  <rect x="160" y="140" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <!-- Node GPU: Readback Req -->
  <rect x="340" y="140" width="140" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <!-- Node CPU: Native Array -->
  <rect x="340" y="260" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <!-- Node CPU: Serialization -->
  <rect x="520" y="260" width="140" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
  <!-- Node Python: Load -->
  <rect x="520" y="380" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <!-- Node Python: Plot -->
  <rect x="700" y="380" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
</g>

<g>
  <!-- Title -->
  <text x="40" y="40" fill="#2d3142" font-size="28" font-family="'Instrument Serif', serif">Telemetry Data Pipeline</text>
  <text x="40" y="60" fill="#7a8399" font-size="14" font-family="'Geist', sans-serif">Asynchronous GPU readback and headless data extraction process.</text>

  <!-- Lane Headers -->
  <text x="40" y="180" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.1em">UNITY GPU</text>
  <text x="40" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.1em">UNITY CPU</text>
  <text x="40" y="420" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.1em">PYTHON ENV</text>

  <!-- Arrow Labels -->
  <text x="320" y="183" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALLBACK</text>
  <text x="410" y="243" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASYNC</text>
  <text x="500" y="303" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPEND</text>
  <text x="590" y="363" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FILE I/O</text>
  <text x="680" y="423" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXPORT</text>

  <!-- Node Texts -->
  <!-- Accumulate -->
  <text x="230" y="174" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Accumulate Dose</text>
  <text x="230" y="192" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">32-bit Float Texture</text>
  
  <!-- Async Request -->
  <text x="410" y="174" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Async Request</text>
  <text x="410" y="192" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Non-blocking VRAM</text>

  <!-- Native Array -->
  <text x="410" y="294" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NativeArray Dump</text>
  <text x="410" y="312" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">CPU safely reads</text>

  <!-- CSV Serialization -->
  <text x="590" y="294" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CSV Serialization</text>
  <text x="590" y="312" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Appending data row</text>

  <!-- Pandas Parsing -->
  <text x="590" y="414" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pandas Parsing</text>
  <text x="590" y="432" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Hourly metrics</text>

  <!-- Data Plotting -->
  <text x="770" y="414" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Data Plotting</text>
  <text x="770" y="432" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Matplotlib charts</text>
</g>
</svg>
</body>
</html>
