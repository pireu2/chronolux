<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { background: #f5f5f5; margin: 0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { max-width: 800px; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Title -->
<text x="40" y="40" fill="#2d3142" font-size="24" font-family="'Instrument Serif', serif">System Architecture</text>
<text x="40" y="60" fill="#7a8399" font-size="12" font-family="'Geist', sans-serif">Texture Space Path Tracer Pipeline</text>

<!-- Edges/Arrows (drawn before boxes) -->
<!-- C# -> DXR -->
<path d="M 160 160 L 260 160" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<!-- Maps -> DXR -->
<path d="M 320 100 L 320 120" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<!-- Perez -> DXR -->
<path d="M 480 160 L 380 160" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<!-- DXR -> Buffer -->
<path d="M 320 200 L 320 240" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<!-- Buffer -> CSV -->
<path d="M 320 320 L 320 360" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Arrow Labels (Masked) -->
<rect x="192" y="148" width="36" height="12" rx="2" fill="#f5f5f5"/>
<text x="210" y="157" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SOLAR</text>

<rect x="412" y="148" width="36" height="12" rx="2" fill="#f5f5f5"/>
<text x="430" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LUMA</text>

<!-- Nodes -->
<!-- Node 1: C# Orchestrator (Backend) -->
<rect x="40" y="120" width="120" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="48" y="126" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
<text x="64" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CPU</text>
<text x="100" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orchestrator</text>
<text x="100" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SunCalc.cs</text>

<!-- Node 2: UV Maps (Store) -->
<rect x="260" y="20" width="120" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="268" y="26" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
<text x="284" y="35" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAPS</text>
<text x="320" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Baker Pre-pass</text>
<text x="320" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pos/Norm UV</text>

<!-- Node 3: DXR Kernel (Focal) -->
<rect x="260" y="120" width="120" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="268" y="126" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
<text x="284" y="135" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GPU</text>
<text x="320" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DXR Path Tracer</text>
<text x="320" y="176" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Compute Shader</text>

<!-- Node 4: Perez Sky (Backend) -->
<rect x="480" y="120" width="120" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="488" y="126" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
<text x="504" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENV</text>
<text x="540" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Perez Sky Model</text>
<text x="540" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Clear Sky T=2.0</text>

<!-- Node 5: Accumulation Buffer (Store) -->
<rect x="260" y="240" width="120" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="268" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
<text x="288" y="255" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VRAM</text>
<text x="320" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dose Buffer</text>
<text x="320" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">32-bit Float</text>

<!-- Node 6: Telemetry CSV (External) -->
<rect x="260" y="360" width="120" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<rect x="268" y="366" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.2)" stroke-width="0.8"/>
<text x="288" y="375" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXPORT</text>
<text x="320" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Telemetry CSV</text>
<text x="320" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Data Analysis</text>

<!-- Legend Strip -->
<line x1="30" y1="480" x2="610" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="30" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="100" y="488" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="116" y="497" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Hardware Compute</text>
<rect x="220" y="488" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="236" y="497" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">CPU Process</text>
<rect x="320" y="488" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="336" y="497" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Memory / Storage</text>
</svg>
</body>
</html>
