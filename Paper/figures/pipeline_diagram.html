<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Diagram</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-paper: #ffffff;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .frame {
      max-width: 900px;
      width: 100%;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg {
      width: 100%;
      min-width: 800px;
      display: block;
    }

    @media print {
      @page {
        margin: 0;
        size: auto;
      }

      body {
        padding: 0;
        margin: 0;
        min-height: auto;
      }

      .eyebrow,
      h1 {
        display: none;
        /* Hide titles when printing so the SVG takes full page */
      }
    }
  </style>
</head>

<body>
  <div class="frame">
    <p class="eyebrow">Pipeline · Texture Space Ray Tracing</p>
    <h1>Vertical Ray Tracing Pipeline</h1>

    <svg viewBox="0 20 900 740" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff" />

      <!-- Start to Baker -->
      <line x1="450" y1="80" x2="450" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
      <!-- Baker to Maps -->
      <line x1="450" y1="160" x2="450" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
      <!-- Maps to Compute -->
      <line x1="450" y1="240" x2="450" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Compute to Thread -->
      <line x1="450" y1="340" x2="450" y2="380" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />

      <!-- Thread split to Direct/Ambient -->
      <path d="M 450 420 L 450 440 L 300 440 L 300 460" fill="none" stroke="#eb6c36" stroke-width="1.4"
        marker-end="url(#arrow-accent)" />
      <path d="M 450 420 L 450 440 L 600 440 L 600 460" fill="none" stroke="#eb6c36" stroke-width="1.4"
        marker-end="url(#arrow-accent)" />

      <!-- Merge into Irradiance -->
      <path d="M 300 500 L 300 520 L 450 520 L 450 540" fill="none" stroke="#eb6c36" stroke-width="1.4"
        marker-end="url(#arrow-accent)" />
      <path d="M 600 500 L 600 520 L 450 520 L 450 540" fill="none" stroke="#eb6c36" stroke-width="1.4"
        marker-end="url(#arrow-accent)" />
      <circle cx="450" cy="520" r="4" fill="#eb6c36" /> <!-- Merge point -->

      <!-- Irradiance to Accumulation -->
      <line x1="450" y1="580" x2="450" y2="620" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />

      <!-- Accumulation split to Outputs -->
      <path d="M 450 660 L 450 680 L 300 680 L 300 700" fill="none" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)" />
      <path d="M 450 660 L 450 680 L 600 680 L 600 700" fill="none" stroke="#4f5d75" stroke-width="1.2"
        marker-end="url(#arrow)" />

      <!-- Node: 3D Artifact Mesh -->
      <rect x="350" y="40" width="200" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="450" y="65" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">3D Artifact Mesh</text>

      <!-- Node: UV Space Baker Pre-pass -->
      <rect x="350" y="120" width="200" height="40" rx="6" fill="rgba(79,93,117,0.05)" stroke="#7a8399"
        stroke-width="1" />
      <text x="450" y="145" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">UV Space Baker Pre-pass</text>

      <!-- Node: Pos/Normal Maps -->
      <rect x="350" y="200" width="200" height="40" rx="6" fill="rgba(45,49,66,0.02)" stroke="#4f5d75"
        stroke-width="1" />
      <text x="450" y="225" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Position & Normal Maps</text>

      <!-- Compute Shader Boundary -->
      <rect x="180" y="260" width="540" height="340" rx="8" fill="rgba(235,108,54,0.02)" stroke="rgba(235,108,54,0.5)"
        stroke-width="1.5" stroke-dasharray="4 4" />
      <text x="450" y="284" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', monospace"
        text-anchor="middle" letter-spacing="0.1em">RAY TRACING COMPUTE SHADER</text>

      <!-- Node: RayGen Kernel -->
      <rect x="350" y="300" width="200" height="40" rx="6" fill="rgba(235,108,54,0.1)" stroke="#eb6c36"
        stroke-width="1.5" />
      <text x="450" y="325" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">RayGen Kernel</text>

      <!-- Node: Thread ID -->
      <rect x="350" y="380" width="200" height="40" rx="6" fill="rgba(235,108,54,0.1)" stroke="#eb6c36"
        stroke-width="1.5" />
      <text x="450" y="405" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Thread ID = UV Texel</text>

      <!-- Node: Direct Solar Beam -->
      <rect x="200" y="460" width="200" height="40" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
      <text x="300" y="485" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Direct Beam (Shadow Ray)</text>

      <!-- Node: Ambient Perez Sky -->
      <rect x="500" y="460" width="200" height="40" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1" />
      <text x="600" y="485" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Indirect Ambient (Perez Sky)</text>

      <!-- Node: Irradiance Calc -->
      <rect x="350" y="540" width="200" height="40" rx="6" fill="rgba(235,108,54,0.1)" stroke="#eb6c36"
        stroke-width="1.5" />
      <text x="450" y="565" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Irradiance Calculation</text>

      <!-- Node: Accumulation Buffer -->
      <rect x="350" y="620" width="200" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <text x="450" y="645" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Accumulation Buffer</text>

      <!-- Node: Outputs (Ovals) -->
      <rect x="200" y="700" width="200" height="40" rx="20" fill="#ffffff" stroke="#4f5d75" stroke-width="1" />
      <text x="300" y="725" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Data Export (CSV)</text>

      <rect x="500" y="700" width="200" height="40" rx="20" fill="#ffffff" stroke="#4f5d75" stroke-width="1" />
      <text x="600" y="725" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Heatmap Vis (EXR)</text>

    </svg>
  </div>
</body>

</html>
