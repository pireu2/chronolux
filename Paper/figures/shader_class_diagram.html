<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoLux · Shader Architecture</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --color-paper: #ffffff;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg {
      width: 100%;
      min-width: 900px;
      display: block;
    }
  </style>
</head>

<body>
  <div class="frame">
    <p class="eyebrow">Architecture Diagram</p>
    <h1>ChronoLux HLSL Compute Shader Hierarchy</h1>

          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />

      <rect width="100%" height="100%" fill="#ffffff" />

      <!-- Dependency Arrows -->

      <line x1="220" y1="280" x2="416" y2="280" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />

      <line x1="576" y1="280" x2="716" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />

      <!-- Arrow labels -->

      <rect x="296" y="268" width="48" height="12" rx="2" fill="#ffffff" />

      <text x="800" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">Cosine Sampling</text>

      <!-- Node: PathTracer.hlsl -->
      <rect x="720" y="248" width="160" height="64" rx="6" fill="#ffffff" />

</html>
