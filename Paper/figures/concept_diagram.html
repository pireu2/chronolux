<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoLux Concept Architecture</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-paper: #ffffff;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg {
      width: 100%;
      min-width: 900px;
      display: block;
    }

    @media print {
      @page {
        margin: 0;
        size: auto;
      }

      body {
        padding: 0;
        margin: 0;
      }

      .eyebrow,
      h1 {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="frame">
    <p class="eyebrow">High-Level Concept</p>
    <h1>ChronoLux System Architecture</h1>

    <svg viewBox="80 160 840 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)" />
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff" />
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55" />

      <!-- Arrows first (behind boxes) -->
      <line x1="280" y1="240" x2="412" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
      <line x1="580" y1="240" x2="712" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)" />

      <!-- Arrow labels -->
      <rect x="322" y="220" width="48" height="12" rx="2" fill="#f5f5f5" />
      <text x="346" y="230" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">LOAD</text>

      <rect x="622" y="220" width="48" height="12" rx="2" fill="#f5f5f5" />
      <text x="646" y="230" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">EXPORT</text>

      <!-- Node 1: Input Assets -->
      <rect x="120" y="200" width="160" height="80" rx="6" fill="#f5f5f5" />
      <rect x="120" y="200" width="160" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"
        stroke-width="1" />
      <rect x="128" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)"
        stroke-width="0.8" />
      <text x="142" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">DATA</text>
      <text x="200" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Input Assets</text>
      <text x="200" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3D
        Models &amp; Environment</text>

      <!-- Node 2: ChronoLux Engine (Focal) -->
      <rect x="420" y="200" width="160" height="80" rx="6" fill="#f5f5f5" />
      <rect x="420" y="200" width="160" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"
        stroke-width="1" />
      <rect x="428" y="208" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)"
        stroke-width="0.8" />
      <text x="444" y="217" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">CORE</text>
      <text x="500" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">ChronoLux Engine</text>
      <text x="500" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DXR
        + Perez Sky</text>

      <!-- Node 3: Output Metrics -->
      <rect x="720" y="200" width="160" height="80" rx="6" fill="#f5f5f5" />
      <rect x="720" y="200" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
      <rect x="728" y="208" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)"
        stroke-width="0.8" />
      <text x="746" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle"
        letter-spacing="0.08em">REPORT</text>
      <text x="800" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
        text-anchor="middle">Output Metrics</text>
      <text x="800" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
        text-anchor="middle">Heatmaps &amp; CSV Datasets</text>

    </svg>
  </div>
</body>

</html>
