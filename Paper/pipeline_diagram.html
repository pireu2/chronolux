<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pipeline · Texture Space Ray Tracing</p>
    <h1>Detailed Ray Tracing Pipeline</h1>

    <svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Arrows -->
      <line x1="130" y1="200" x2="130" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/> <!-- Mesh to Baker -->
      
      <line x1="220" y1="260" x2="280" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/> <!-- Baker to PosMap -->
      <line x1="220" y1="260" x2="280" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/> <!-- Baker to NormMap -->
      
      <line x1="460" y1="200" x2="520" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/> <!-- PosMap to Tracer -->
      <line x1="460" y1="300" x2="520" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/> <!-- NormMap to Tracer -->
      
      <!-- Thread ID Read dashed arrows -->
      <path d="M 540 120 C 400 120, 370 170, 370 175" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)"/>
      <path d="M 540 120 C 300 120, 370 270, 370 275" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)"/>

      <!-- Internal Compute Arrows -->
      <line x1="670" y1="220" x2="670" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/> <!-- Tracer to Direct -->
      <line x1="670" y1="220" x2="670" y2="310" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/> <!-- Tracer to Ambient -->
      <line x1="670" y1="280" x2="670" y2="380" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/> <!-- Direct to Calc -->
      <line x1="670" y1="350" x2="670" y2="380" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/> <!-- Ambient to Calc -->

      <line x1="800" y1="400" x2="900" y2="280" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/> <!-- Calc to Accumulation Buffer -->

      <!-- Output Arrows -->
      <line x1="1000" y1="240" x2="1000" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/> <!-- Buffer to Sensors -->
      <line x1="1000" y1="280" x2="1000" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/> <!-- Buffer to Heatmap -->

      <!-- ================= Col 1: Inputs ================= -->
      <rect x="40" y="160" width="180" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="130" y="185" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3D Artifact Mesh</text>

      <rect x="40" y="240" width="180" height="40" rx="4" fill="rgba(79,93,117,0.1)" stroke="#7a8399" stroke-width="1"/>
      <text x="130" y="265" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UV Space Baker Pre-pass</text>

      <!-- ================= Col 2: GPU Memory ================= -->
      <rect x="260" y="140" width="220" height="220" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.2)" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="370" y="165" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">GPU MEMORY</text>

      <rect x="280" y="180" width="180" height="40" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="370" y="205" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Position Map (RGBFloat)</text>

      <rect x="280" y="280" width="180" height="40" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="370" y="305" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Normal Map (RGBFloat)</text>

      <!-- ================= Col 3: Compute Shader (Focal) ================= -->
      <rect x="520" y="60" width="300" height="380" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.5)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="670" y="85" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">RAY TRACING COMPUTE SHADER</text>

      <rect x="540" y="100" width="260" height="40" rx="4" fill="rgba(235,108,54,0.1)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="670" y="125" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thread ID = UV Texel</text>

      <rect x="540" y="180" width="260" height="40" rx="4" fill="rgba(235,108,54,0.1)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="670" y="205" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Path Tracer Core</text>

      <rect x="540" y="240" width="260" height="40" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="670" y="265" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Direct Solar Beam (Shadow Ray)</text>

      <rect x="540" y="310" width="260" height="40" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
      <text x="670" y="335" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ambient Perez Sky (Cosine Sample)</text>

      <rect x="540" y="380" width="260" height="40" rx="4" fill="rgba(235,108,54,0.1)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="670" y="405" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Irradiance Calculation</text>

      <!-- ================= Col 4: Output / Vis ================= -->
      <rect x="880" y="240" width="240" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1000" y="265" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Accumulation Buffer (RFloat)</text>

      <rect x="880" y="160" width="240" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="1000" y="185" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Virtual Lux Sensors (Telemetry)</text>

      <rect x="880" y="320" width="240" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="1000" y="345" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Heatmap Visualization</text>

    </svg>
  </div>
</body>
</html>
